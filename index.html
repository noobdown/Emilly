<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Emilly ❤️</title>

<style>
@media (min-width: 768px) {
  body::before {
    content: "Esta página foi feita para ser vista apenas no celular 💕";
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    color: #fff;
    z-index: 9999;
    text-align: center;
    padding: 2rem;
  }
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(180deg, #6a1b9a, #000);
  color: #fff;
}

/* HEADER */
header {
  text-align: center;
  padding: 1.5rem 1rem;
  font-size: 1.6rem;
  font-weight: 600;
}

header span {
  display: block;
  font-size: 1rem;
  margin-top: .3rem;
  opacity: .9;
}

/* SEÇÃO */
section {
  padding: 2rem 0;
  display: flex;
  justify-content: center;
}

.section-text {
  width: 80%;
  text-align: center;
  color: #e1bee7;
  line-height: 1.5;
  margin-bottom: 1rem;
}

/* CARROSSEL */
.carousel {
  width: 80%;
  max-width: 320px;
  aspect-ratio: 3 / 4;
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.4);
}

.carousel img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: scale(1.05);
  transition: opacity 1s ease, transform 1s ease;
}

.carousel img.active {
  opacity: 1;
  transform: scale(1);
}

/* LINHA DO TEMPO */
.timeline-connector {
  display: flex;
  justify-content: center;
  padding: 2.5rem 0;
}

.line {
  width: 4px;
  height: 120px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    #e1bee7,
    rgba(255,255,255,0)
  );
  border-radius: 10px;
}

/* FOOTER */
footer {
  padding: 2rem 1rem;
  text-align: center;
  font-size: .95rem;
}

footer strong {
  display: block;
  margin-top: .4rem;
}
</style>
</head>

<body>

<header>
  Para a mulher que ilumina meus dias ✨
  <span>Emilly ❤️</span>
</header>

<!-- FASE 1 -->
<section>
  <div>
    <div class="section-text">
      Outubro a Dezembro.<br>
      Quando a gente ainda estava se conhecendo…
    </div>

    <div class="carousel" id="carousel1">
      <img src="images/amor1.jpeg" class="active">
      <img src="images/eu2.jpeg">
      <img src="images/amor2.jpeg">
      <img src="images/eu3.jpeg">
      <img src="images/amor3.jpeg">
      <img src="images/amor4.jpeg">
    </div>
  </div>
</section>

<!-- CONECTOR DO TEMPO -->
<div class="timeline-connector">
  <div class="line"></div>
</div>

<!-- FASE 2 -->
<section>
  <div>
    <div class="section-text">
      Entre o Natal e o Ano Novo…<br>
      nasceu algo que mudou tudo.
    </div>

    <div class="carousel" id="carousel2">
      <img src="images/fim2025/capa.jpeg" class="active">
      <img src="images/fim2025/ela.jpeg">
      <img src="images/fim2025/nos1.jpeg">
      <img src="images/fim2025/nos2.jpeg">
      <img src="images/fim2025/nos3.jpeg">
      <img src="images/fim2025/nos4.jpeg">
    </div>
  </div>
</section>

<footer>
  O tempo passou.<br>
  <strong>E foi você que ficou. 💕</strong>
</footer>

<script>
function startCarousel(id, interval = 3000) {
  const images = document.querySelectorAll(`#${id} img`);
  let index = 0;

  setInterval(() => {
    images[index].classList.remove('active');
    index = (index + 1) % images.length;
    images[index].classList.add('active');
  }, interval);
}

startCarousel('carousel1', 2800);
startCarousel('carousel2', 3200);
</script>

</body>
</html>
